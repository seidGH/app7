name: CD pipline build push and Deploy EC2

on:
    workflow_run:
    workflows: ["Docker CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
     if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker Image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/app7:latest .

      # 4. Push Image to Docker Hub
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/app7:latest

      # 5. SSH into EC2 and Deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/app7:latest

            docker stop app7 || true
            docker rm app7 || true

            docker run -d \
              --name app7 \
              -p 80:5000 \
              ${{ secrets.DOCKER_USERNAME }}/app7:latest
