name: CD pipeline build push and Deploy EC2

on:
  workflow_run:
    workflows: ["Docker CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    # Only run if the CI pipeline was successful
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub using GitHub Secrets
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build the Docker image and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app7:latest

      # 4. SSH into EC2 and update the running container
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Login to Docker on the EC2 instance
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull the fresh image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/app7:latest

            # Stop and remove the old container if it exists (prevents naming conflicts)
            docker stop app7-container || true
            docker rm app7-container || true
            # Run the new container
            # Maps Port 80 on the EC2 to Port 8080 inside the Docker container
            docker run -d \
            --name app7-container \
            -p 80:8080 \
            ${{ secrets.DOCKER_USERNAME }}/app7:latest
